<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../components.css"><style>body{padding:28px;display:grid;gap:22px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.s{border:1px solid var(--line);border-radius:var(--r-control);overflow:hidden;background:var(--surface)}.s i{display:block;height:56px}.s b{display:block;padding:8px 10px 0;font-weight:500}.s span{display:block;padding:0 10px 8px;color:var(--ink-3);font-size:var(--text-sm)}h3{font-size:var(--text-md);color:var(--ink-2);font-weight:500}</style></head><body>
<h3>Brand and meaning</h3><div class="sw">
<div class="s"><i style="background:var(--hex-blue)"></i><b>Hex blue</b><span>Gigs, pitches, primary action</span></div>
<div class="s"><i style="background:var(--hex-cyan)"></i><b>Hex cyan</b><span>Devin, building, live</span></div>
<div class="s"><i style="background:var(--hex-green)"></i><b>Hex green</b><span>Money in, paid</span></div>
<div class="s"><i style="background:var(--amber)"></i><b>Amber</b><span>Money waiting</span></div>
<div class="s"><i style="background:var(--coral)"></i><b>Coral</b><span>Overdue, blocked, failed</span></div>
</div>
<h3>Neutrals</h3><div class="sw">
<div class="s"><i style="background:var(--night)"></i><b>Night</b><span>Sidebar</span></div>
<div class="s"><i style="background:var(--ink)"></i><b>Ink</b><span>Primary text</span></div>
<div class="s"><i style="background:var(--ink-2)"></i><b>Ink 2</b><span>Secondary text</span></div>
<div class="s"><i style="background:var(--line)"></i><b>Line</b><span>Borders, dividers</span></div>
<div class="s"><i style="background:var(--canvas)"></i><b>Canvas</b><span>App background</span></div>
</div></body></html>
